
services:
  api:
    build:
      context: .
      dockerfile: src/dockerfile
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    environment:
#TODO: Fix this
      - DB_USERNAME=fix
      - DB_PASSWORD=This
      - DATABASE_URL=postgresql://fix:This@db/dockerfun
      - ENV=test
      - LOGGER_LEVEL=DEBUG
      - SCHEDULER_MIN=60
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - db

  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=fix
      - POSTGRES_PASSWORD=This
      - POSTGRES_DB=dockerfun
    ports:
      - "5432:5432"

  redis:
    image: redis
    ports:
      - "6379:6379"

  celery_worker:
    container_name: celery_worker
    build:
      context: .
      dockerfile: src/dockerfile
    command: celery -A src.celery_worker worker --pool=solo --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - redis
      - api
    environment:
      #TODO: Fix this
      - DB_USERNAME=fix
      - DB_PASSWORD=This
      - DATABASE_URL=postgresql://fix:This@db/dockerfun
      - ENV=test
      - LOGGER_LEVEL=DEBUG
      - SCHEDULER_MIN=60
      - CELERY_BROKER_URL=redis://redis/0
      - CELERY_RESULT_BACKEND=redis://redis/0

  flower:
    container_name: flower
    build:
      context: .
      dockerfile: src/dockerfile
    command: celery -A src.celery_worker.celery_app flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - api
      - redis
      - celery_worker
    environment:
      #TODO: Fix this
      - CELERY_BROKER_URL=redis://redis/0
      - CELERY_RESULT_BACKEND=redis://redis/0

volumes:
  postgres_data:
